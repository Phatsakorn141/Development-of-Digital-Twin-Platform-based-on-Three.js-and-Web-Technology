# listener สำหรับ bridge.py — MQTT over TCP ธรรมดา ไม่มี TLS
listener 1883
protocol mqtt

# listener สำหรับเบราว์เซอร์ — ต้องเป็น WebSocket เท่านั้น
# เบราว์เซอร์เปิด TCP socket ดิบไม่ได้ จึงต้องมี listener แยกคนละ port
listener 9001
protocol websockets

# เปิดให้ต่อได้โดยไม่ต้องมี user/password
# ปลอดภัยเพราะ broker ตัวนี้อยู่ในเครื่องเรา ไม่ได้เปิดออกอินเทอร์เน็ต
allow_anonymous true

persistence false
log_dest stdout
